<title>BESY 근무기록</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181c;--muted:#6b6f7a;--line:#e6e8ec;--accent:#2f5bea;--danger:#e5484d;--warn:#f5a524;--ok:#30a46c;--soft:#eef1fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111215;--card:#1b1d22;--text:#eceef2;--muted:#9196a1;--line:#2a2d34;--accent:#5b7cff;--danger:#f2555a;--soft:#22263a}}
:root[data-theme="dark"]{--bg:#111215;--card:#1b1d22;--text:#eceef2;--muted:#9196a1;--line:#2a2d34;--accent:#5b7cff;--danger:#f2555a;--soft:#22263a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:700;font-size:22px;letter-spacing:.12em}
.who{color:var(--muted);display:flex;align-items:center;gap:8px}
.who b{color:var(--text);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.working{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.paused{background:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs[hidden]{display:none}
.tab{flex:1;font:inherit;font-weight:600;font-size:14px;padding:9px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.clock{text-align:center;padding:26px 20px}
.today{color:var(--muted);font-size:14px}
.status{margin-top:12px;font-weight:600}
.timer{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.meta{display:flex;justify-content:center;gap:28px;color:var(--muted);font-size:14px}
.meta b{color:var(--text);margin-left:6px;font-weight:600;font-variant-numeric:tabular-nums}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.btn{font:inherit;font-weight:600;padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.resume{background:var(--warn);border-color:var(--warn);color:#1a1300}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:500;color:var(--muted);font-size:13px}
.todo-add{display:flex;gap:8px;margin-bottom:10px}
.todo-add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.todo-add input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.todos{list-style:none;margin:0;padding:0}
.todos li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.todos li:first-child{border-top:0}
.todos input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.todos span{flex:1;word-break:break-word}
.todos li.done span{color:var(--muted);text-decoration:line-through}
.todos .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.empty{color:var(--muted);font-size:14px}
.month-mini{display:flex;justify-content:space-between;align-items:baseline}
.month-mini .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.month-mini .sub{color:var(--muted);font-size:13px}
.note{text-align:center;font-size:12px;color:var(--muted)}
/* 관리자 */
.live{display:flex;align-items:center;gap:6px 10px;font-size:15px;font-weight:600;flex-wrap:wrap}
.live .when{color:var(--muted);font-size:13px;font-weight:400;width:100%;padding-left:19px;font-variant-numeric:tabular-nums}
.live .when:empty{display:none}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav b{font-size:17px}
.mnav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;width:36px;height:36px;cursor:pointer;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:4px}
.dow.sun,.day.sun .n{color:var(--danger)}
.dow.sat,.day.sat .n{color:var(--accent)}
.day{aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;background:var(--bg);padding:5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font:inherit;color:var(--text);text-align:left;min-width:0}
.day.blank{background:none;cursor:default}
.day .n{font-size:12px;font-weight:600}
.day .h{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.day.today{border-color:var(--accent)}
.day.sel{outline:2px solid var(--text);outline-offset:-2px}
.day.live .h{color:var(--ok)}
.legend{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.detail .rec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.detail .rec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kv div{font-size:13px;color:var(--muted)}
.kv b{display:block;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;font-weight:600;margin:10px 0 4px}
.txt{font-size:14px;white-space:pre-line;color:var(--text)}
.tlist{list-style:none;margin:0;padding:0;font-size:14px}
.tlist li{padding:2px 0}
.tlist li.no{color:var(--muted)}
.nlink{font-size:13px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nlink a{color:var(--accent)}
.warn{color:var(--danger)}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.overlay{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.open{display:flex}
.dlg{background:var(--card);border-radius:16px;padding:22px;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto}
.dlg h3{margin:0 0 6px;font-size:18px}
.sum{color:var(--muted);font-size:14px;margin:0 0 16px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
textarea{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:8px 0 0}
.acts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
@media (max-width:400px){.stats{grid-template-columns:repeat(2,1fr)}.timer{font-size:46px}.day{padding:4px}.day .h{font-size:11px}}
</style>

<main class="wrap">
  <header class="top">
    <div class="brand">BESY</div>
    <div class="who"><span class="dot" id="dot"></span><b>혜린</b> 님</div>
  </header>

  <nav class="tabs" id="tabs" hidden>
    <button class="tab on" data-tab="work">근무</button>
    <button class="tab" data-tab="admin">관리자</button>
  </nav>

  <!-- ───────── 근무 화면 ───────── -->
  <div id="view-work">
    <section class="card clock">
      <div class="today" id="today"></div>
      <div class="status" id="statusText">출근 전</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="meta">
        <div>출근<b id="startAt">--:--</b></div>
        <div>휴식<b id="breakTime">0분</b></div>
      </div>
      <div class="buttons">
        <button id="btnStart" class="btn primary">근무 시작</button>
        <button id="btnPause" class="btn" disabled>일시정지</button>
        <button id="btnEnd" class="btn danger" disabled>퇴근</button>
      </div>
    </section>

    <section class="card">
      <h2>오늘 할 일 <small id="todoCount"></small></h2>
      <form class="todo-add" id="todoForm">
        <input id="todoInput" placeholder="할 일을 적고 추가를 눌러주세요" maxlength="200" autocomplete="off">
        <button class="btn primary sm" type="submit">추가</button>
      </form>
      <ul class="todos" id="todos"></ul>
    </section>

    <section class="card">
      <div class="month-mini">
        <div><div class="sub" id="myMonthLabel">이번 달 누적 근무</div><div class="big" id="myMonthTotal">0시간 0분</div></div>
        <div class="sub" id="myMonthDays">0일 근무</div>
      </div>
    </section>

    <p class="note" id="note">퇴근하면 노션 「BESY 근무 기록」에 저장돼요</p>
  </div>

  <!-- ───────── 관리자 화면 ───────── -->
  <div id="view-admin" hidden>
    <section class="card">
      <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">혜린 님 · 출근 전</span><span class="when" id="liveWhen"></span></div>
    </section>

    <section class="card">
      <div class="mnav">
        <button id="prevM" aria-label="이전 달">‹</button>
        <b id="mLabel"></b>
        <button id="nextM" aria-label="다음 달">›</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">총 근무</div><div class="v" id="sTotal">0시간 0분</div></div>
        <div class="stat"><div class="k">근무일</div><div class="v" id="sDays">0일</div></div>
        <div class="stat"><div class="k">하루 평균</div><div class="v" id="sAvg">-</div></div>
        <div class="stat"><div class="k">총 휴식</div><div class="v" id="sBreak">0시간 0분</div></div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend">적음 <i style="background:var(--bg)"></i><i id="lg1"></i><i id="lg2"></i><i id="lg3"></i> 많음</div>
    </section>

    <section class="card detail" id="detail"><p class="empty">달력에서 날짜를 누르면 그날 기록을 볼 수 있어요.</p></section>

    <section class="card" id="syncCard" hidden>
      <div class="syncbar"><span id="syncText"></span><button class="btn sm primary" id="btnSyncAll">노션에 저장</button></div>
    </section>

    <p class="note" id="adminNote"></p>
  </div>
</main>

<div class="overlay" id="overlay">
  <form class="dlg" id="endForm">
    <h3>오늘도 수고했어요, 혜린 님 👏</h3>
    <p class="sum" id="endSummary"></p>
    <label for="summary">오늘 한 일</label>
    <textarea id="summary" rows="7" placeholder="- 고객 문의 응대&#10;- 상세페이지 수정&#10;- 다음 주 일정 정리"></textarea>
    <p class="err" id="endError"></p>
    <div class="acts">
      <button type="button" class="btn" id="btnCancel">계속 근무</button>
      <button type="submit" class="btn primary" id="btnSave">저장하고 퇴근</button>
    </div>
  </form>
</div>

<script>
const DATA_SOURCE = 'f69c00e4-f3c6-4181-a914-727f5ad53039'; // 노션 'BESY 근무 기록'
const EMPLOYEE = '혜린', COMPANY = 'BESY';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const durM = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ' ' + (m % 60) + '분' : ''}` : `${m}분`; };
const dur = ms => durM(ms / 60000);
const hmK = m => { m = Math.round(m); return `${Math.floor(m / 60)}시간 ${m % 60}분`; };
const hhmm = m => `${Math.floor(m / 60)}:${pad(Math.round(m) % 60)}`;
const ymd = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parse = (s, d) => { try { return s ? JSON.parse(s) : d; } catch { return d; } };
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ───────── 상태 ─────────
let session = ls.get('besy.session', null);   // {start, pauses:[{from,to}]}
let todos = ls.get('besy.todos', []);          // [{id,text,done}]
let records = ls.get('besy.records', []);      // 완료된 근무 기록
let db = null, stateRef = null;
let selDate = null;
const now0 = new Date(); let viewY = now0.getFullYear(), viewM = now0.getMonth();

// 예전 버전(v1) 기록 옮기기
if (!records.length) {
  const old = ls.get('besy.history', []);
  if (old.length) records = old.map((r, i) => ({ ...r, id: 'old' + i + '-' + r.date }));
}

function saveLocal() { ls.set('besy.session', session); ls.set('besy.todos', todos); ls.set('besy.records', records); }

let stateTimer = null;
function saveState() {
  saveLocal();
  if (!stateRef) return;
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => {
    stateRef.set({ session: session ? JSON.stringify(session) : '', todos: JSON.stringify(todos), updatedAt: Date.now() })
      .catch(e => note(dbErr(e)));
  }, 250);
}
async function saveRecord(r) {
  const i = records.findIndex(x => x.id === r.id);
  if (i >= 0) records[i] = r; else records.unshift(r);
  saveLocal();
  if (db) {
    const { id, ...data } = r;
    await db.collection('records').doc(id).set({ ...data, todos: JSON.stringify(r.todos || []) });
  }
}
function dbErr(e) {
  if (e && (e.code === 'permission_denied' || e.code === 'not_granted')) return '⚠️ 기록할 권한이 없어요. 관리자에게 링크 권한(편집 가능)을 요청해 주세요.';
  return '⚠️ 기록을 서버에 저장하지 못했어요. 인터넷 연결을 확인해 주세요. (이 기기에는 남아 있어요)';
}

// ───────── 서버(db) 연결 ─────────
(async () => {
  const [d, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const isAdmin = user ? await user.canEdit().catch(() => false) : true;
  if (isAdmin) $('tabs').hidden = false;
  if (!d) return;
  db = d;
  stateRef = db.doc('state/current');
  const loadTimer = setTimeout(() => note('⚠️ 기록을 불러오는 데 시간이 걸리고 있어요.'), 10000);
  let firstState = true, firstRecords = true;
  stateRef.onSnapshot(s => {
    clearTimeout(loadTimer);
    const v = s.exists ? s.data() : null;
    if (v) { session = parse(v.session, null); todos = parse(v.todos, []); }
    else if (firstState && (session || todos.length)) saveState(); // 이 기기에만 있던 상태 올리기
    firstState = false;
    saveLocal(); render(); renderTodos(); renderAdmin();
  }, () => {});
  db.collection('records').onSnapshot(snap => {
    clearTimeout(loadTimer);
    const remote = snap.docs.map(x => { const r = x.data(); return { ...r, id: x.id, todos: parse(r.todos, []) }; });
    if (firstRecords && !remote.length && records.length) records.forEach(r => saveRecord(r).catch(() => {})); // 예전 기록 올리기
    else records = remote.sort((a, b) => (b.endTs || 0) - (a.endTs || 0));
    firstRecords = false;
    saveLocal(); renderMonthMini(); renderAdmin();
  }, e => note(dbErr(e)));
})();

// ───────── 계산 ─────────
const isPaused = () => !!(session && session.pauses.length && session.pauses.at(-1).to == null);
const breakMs = (now = Date.now()) => session ? session.pauses.reduce((a, p) => a + ((p.to ?? now) - p.from), 0) : 0;
const workMs = (now = Date.now()) => session ? now - session.start - breakMs(now) : 0;
const stateName = () => !session ? 'idle' : isPaused() ? 'paused' : 'working';
function monthRecords(y, m) { const pre = `${y}-${pad(m + 1)}-`; return records.filter(r => r.date && r.date.startsWith(pre)); }
function byDay(list) { const o = {}; list.forEach(r => { (o[r.date] ||= []).push(r); }); return o; }

// ───────── 근무 화면 ─────────
function render() {
  $('today').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  $('timer').textContent = hms(workMs());
  $('startAt').textContent = session ? hm(session.start) : '--:--';
  $('breakTime').textContent = dur(breakMs());
  const st = stateName();
  $('statusText').textContent = { idle: '출근 전', working: '근무 중', paused: '일시정지 중' }[st];
  $('dot').className = 'dot ' + st;
  $('btnStart').disabled = st !== 'idle';
  $('btnPause').disabled = st === 'idle';
  $('btnEnd').disabled = st === 'idle';
  $('btnPause').textContent = st === 'paused' ? '근무 재개' : '일시정지';
  $('btnPause').classList.toggle('resume', st === 'paused');
  renderLive();
}

function renderTodos() {
  const ul = $('todos'); ul.replaceChildren();
  const done = todos.filter(t => t.done).length;
  $('todoCount').textContent = todos.length ? `${done} / ${todos.length} 완료` : '';
  if (!todos.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '출근하면 오늘 할 일을 먼저 적어보세요.'; ul.append(li); return; }
  todos.forEach(t => {
    const li = document.createElement('li'); if (t.done) li.className = 'done';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!t.done;
    cb.onchange = () => { t.done = cb.checked; saveState(); renderTodos(); };
    const sp = document.createElement('span'); sp.textContent = t.text;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '삭제');
    x.onclick = () => { todos = todos.filter(o => o !== t); saveState(); renderTodos(); };
    li.append(cb, sp, x); ul.append(li);
  });
}
$('todoForm').onsubmit = e => {
  e.preventDefault();
  const v = $('todoInput').value.trim(); if (!v) return;
  todos.push({ id: Date.now().toString(36), text: v, done: false });
  $('todoInput').value = ''; saveState(); renderTodos();
};

function renderMonthMini() {
  const n = new Date(), list = monthRecords(n.getFullYear(), n.getMonth());
  const total = list.reduce((a, r) => a + (r.workMinutes || 0), 0);
  $('myMonthLabel').textContent = `${n.getMonth() + 1}월 누적 근무`;
  $('myMonthTotal').textContent = hmK(total);
  $('myMonthDays').textContent = `${Object.keys(byDay(list)).length}일 근무`;
}
function note(t) { $('note').textContent = t; $('adminNote').textContent = t; }

// ───────── 노션 저장 ─────────
function errorText(e) {
  switch (e && e.code) {
    case 'server_not_connected': return 'claude.ai 설정 → 커넥터에서 Notion을 연결해 주세요.';
    case 'needs_reauth': return 'claude.ai 설정 → 커넥터에서 Notion을 다시 연결해 주세요.';
    case 'not_in_manifest': case 'approval_required': case 'consent_required': return '노션 사용 허락이 필요해요. 다시 시도하면 허락 창이 떠요.';
    case 'selection_required': return '연결된 Notion이 여러 개예요. 화면에 뜨는 선택 창에서 하나를 골라주세요.';
    case 'server_unavailable': case 'upstream_error': return '노션 응답이 늦어요. 노션에 들어갔는지 먼저 확인해 주세요.';
    case 'tool_error': return '노션이 저장을 거절했어요. (노션 「BESY 근무 기록」에 접근할 수 있는 계정인지 확인해 주세요)';
    default: return '이 화면에서는 노션에 연결할 수 없어요. claude.ai에서 열어주세요.';
  }
}
async function sendToNotion(r) {
  const mcp = await claude.use('mcp');
  if (!mcp) throw { code: 'not_granted' };
  const lines = s => s.split('\n').map(l => l.trim()).filter(Boolean).map(l => '- ' + l.replace(/^[-*•]\s*/, '')).join('\n');
  const t = r.todos || [];
  const todoMd = t.length ? t.map(x => `- [${x.done ? 'x' : ' '}] ${x.text}`).join('\n') : '(없음)';
  const todoProp = t.map(x => (x.done ? '✓ ' : '○ ') + x.text).join('\n').slice(0, 1900);
  const res = await mcp.callTool('Notion', 'notion-create-pages', {
    parent: { data_source_id: DATA_SOURCE },
    pages: [{
      icon: '🕒',
      properties: {
        '이름': `${r.employee} · ${r.date}`,
        'date:날짜:start': r.date, 'date:날짜:is_datetime': 0,
        '직원': r.employee, '회사': r.company,
        '출근': r.startText, '퇴근': r.endText,
        '근무시간(분)': r.workMinutes, '휴식시간(분)': r.breakMinutes,
        '오늘 할 일': todoProp,
        '오늘 한 일': (r.summary || '').slice(0, 1900),
      },
      content: `## 근무 요약\n출근 ${r.startText} · 퇴근 ${r.endText} · 실근무 ${durM(r.workMinutes)} · 휴식 ${durM(r.breakMinutes)}\n\n## 오늘 할 일\n${todoMd}\n\n## 오늘 한 일\n${lines(r.summary || '') || '(없음)'}`,
    }],
  });
  const text = JSON.stringify(res.payload ?? res.content ?? '');
  const m = text.match(/https:\/\/(?:www\.|app\.)?notion\.(?:so|com)\/[^\s"'\\<>)}\]]+/);
  return m ? m[0] : '';
}
async function pushToNotion(r) {
  try { const url = await sendToNotion(r); await saveRecord({ ...r, notionSaved: true, notionUrl: url }); return null; }
  catch (e) { return e; }
}

// ───────── 버튼 ─────────
$('btnStart').onclick = () => { session = { start: Date.now(), pauses: [] }; saveState(); render(); };
$('btnPause').onclick = () => {
  if (isPaused()) session.pauses.at(-1).to = Date.now();
  else session.pauses.push({ from: Date.now(), to: null });
  saveState(); render();
};
$('btnEnd').onclick = () => {
  const now = Date.now();
  $('endSummary').textContent = `출근 ${hm(session.start)} · 지금 ${hm(now)} · 실근무 ${dur(workMs(now))} · 휴식 ${dur(breakMs(now))}`;
  $('endError').textContent = '';
  if (!$('summary').value.trim()) $('summary').value = todos.filter(t => t.done).map(t => '- ' + t.text).join('\n');
  $('overlay').classList.add('open'); $('summary').focus();
};
$('btnCancel').onclick = () => $('overlay').classList.remove('open');

$('endForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('summary').value.trim();
  if (!text) { $('endError').textContent = '오늘 한 일을 적어주세요.'; return; }
  const now = Date.now();
  if (isPaused()) session.pauses.at(-1).to = now;
  const r = {
    id: `${ymd(session.start)}-${session.start}`, employee: EMPLOYEE, company: COMPANY, date: ymd(session.start),
    startTs: session.start, endTs: now, startText: hm(session.start), endText: hm(now),
    workMinutes: Math.round(workMs(now) / 60000), breakMinutes: Math.round(breakMs(now) / 60000),
    summary: text, todos: todos.map(t => ({ text: t.text, done: !!t.done })), notionSaved: false, notionUrl: '',
  };
  $('btnSave').disabled = true; $('btnSave').textContent = '저장 중…';
  try { await saveRecord(r); } catch (err) { note(dbErr(err)); }
  // 기록 완료 → 근무 종료, 못 끝낸 할 일은 내일로
  session = null; todos = todos.filter(t => !t.done); saveState();
  const fail = await pushToNotion(r);
  $('btnSave').disabled = false; $('btnSave').textContent = '저장하고 퇴근';
  if (fail) { $('endError').textContent = errorText(fail) + ' 기록은 남아 있고, 관리자 화면에서 다시 저장할 수 있어요.'; await new Promise(x => setTimeout(x, 2800)); }
  $('summary').value = ''; $('overlay').classList.remove('open');
  note(fail ? '⚠️ 근무 기록은 저장됐지만 노션 저장은 아직이에요.' : '✅ 노션까지 저장됐어요. 오늘도 수고 많았어요!');
  render(); renderTodos(); renderMonthMini(); renderAdmin();
};

// ───────── 탭 ─────────
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('view-work').hidden = b.dataset.tab !== 'work';
  $('view-admin').hidden = b.dataset.tab !== 'admin';
  renderAdmin();
});

// ───────── 관리자 화면 ─────────
function renderLive() {
  if ($('view-admin').hidden) return;
  const st = stateName();
  $('liveDot').className = 'dot ' + st;
  $('liveText').textContent = `${EMPLOYEE} 님 · ` + { idle: '출근 전', working: '근무 중', paused: '휴식 중' }[st];
  $('liveWhen').textContent = session ? `${hm(session.start)} 출근 · 실근무 ${hms(workMs())}` : '';
}
const heat = m => m <= 0 ? 'var(--bg)' : `color-mix(in srgb, var(--accent) ${Math.round(12 + Math.min(m / 540, 1) * 48)}%, var(--card))`;
$('lg1').style.background = heat(120); $('lg2').style.background = heat(300); $('lg3').style.background = heat(540);

function renderAdmin() {
  if ($('view-admin').hidden) return;
  renderLive();
  const list = monthRecords(viewY, viewM), days = byDay(list);
  const total = list.reduce((a, r) => a + (r.workMinutes || 0), 0);
  const brk = list.reduce((a, r) => a + (r.breakMinutes || 0), 0);
  const nDays = Object.keys(days).length;
  $('mLabel').textContent = `${viewY}년 ${viewM + 1}월`;
  $('sTotal').textContent = hmK(total);
  $('sDays').textContent = `${nDays}일`;
  $('sAvg').textContent = nDays ? hmK(total / nDays) : '-';
  $('sBreak').textContent = hmK(brk);

  const cal = $('cal'); cal.replaceChildren();
  ['일', '월', '화', '수', '목', '금', '토'].forEach((d, i) => { const e = document.createElement('div'); e.className = 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : ''); e.textContent = d; cal.append(e); });
  const first = new Date(viewY, viewM, 1).getDay(), last = new Date(viewY, viewM + 1, 0).getDate();
  for (let i = 0; i < first; i++) { const e = document.createElement('div'); e.className = 'day blank'; cal.append(e); }
  const todayStr = ymd(Date.now());
  for (let d = 1; d <= last; d++) {
    const ds = `${viewY}-${pad(viewM + 1)}-${pad(d)}`, dow = (first + d - 1) % 7;
    let mins = (days[ds] || []).reduce((a, r) => a + (r.workMinutes || 0), 0);
    const live = session && ymd(session.start) === ds;
    if (live) mins += workMs() / 60000;
    const b = document.createElement('button');
    b.className = 'day' + (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '') + (ds === todayStr ? ' today' : '') + (ds === selDate ? ' sel' : '') + (live ? ' live' : '');
    b.style.background = heat(mins);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = d;
    const h = document.createElement('span'); h.className = 'h'; h.textContent = mins >= 1 ? hhmm(mins) : '';
    b.append(n, h); b.onclick = () => { selDate = ds; renderAdmin(); };
    cal.append(b);
  }
  renderDetail();
  const unsynced = records.filter(r => !r.notionSaved);
  $('syncCard').hidden = !unsynced.length;
  $('syncText').textContent = `노션에 아직 안 들어간 기록 ${unsynced.length}건`;
}

function renderDetail() {
  const box = $('detail'); box.replaceChildren();
  if (!selDate) { box.innerHTML = '<p class="empty">달력에서 날짜를 누르면 그날 기록을 볼 수 있어요.</p>'; return; }
  const [y, m, d] = selDate.split('-').map(Number);
  const h = document.createElement('h2'); h.textContent = new Date(y, m - 1, d).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  box.append(h);
  const list = records.filter(r => r.date === selDate).sort((a, b) => a.startTs - b.startTs);
  if (session && ymd(session.start) === selDate) {
    const p = document.createElement('p'); p.className = 'txt'; p.textContent = `🟢 지금 근무 중 · ${hm(session.start)} 출근 · 실근무 ${dur(workMs())}`; box.append(p);
  }
  if (!list.length) { if (!(session && ymd(session.start) === selDate)) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = '이날은 근무 기록이 없어요.'; box.append(p); } return; }
  list.forEach(r => {
    const div = document.createElement('div'); div.className = 'rec';
    div.innerHTML = `<div class="kv"><div>출근<b></b></div><div>퇴근<b></b></div><div>실근무<b></b></div></div>`;
    const bs = div.querySelectorAll('b'); bs[0].textContent = r.startText; bs[1].textContent = r.endText; bs[2].textContent = durM(r.workMinutes || 0);
    const sub = document.createElement('div'); sub.className = 'empty'; sub.textContent = `휴식 ${durM(r.breakMinutes || 0)}`; div.append(sub);
    if (r.todos && r.todos.length) {
      const l = document.createElement('div'); l.className = 'lbl'; l.textContent = `오늘 할 일 (${r.todos.filter(t => t.done).length}/${r.todos.length})`;
      const ul = document.createElement('ul'); ul.className = 'tlist';
      r.todos.forEach(t => { const li = document.createElement('li'); li.className = t.done ? '' : 'no'; li.textContent = (t.done ? '✅ ' : '⬜ ') + t.text; ul.append(li); });
      div.append(l, ul);
    }
    const l2 = document.createElement('div'); l2.className = 'lbl'; l2.textContent = '오늘 한 일';
    const tx = document.createElement('div'); tx.className = 'txt'; tx.textContent = r.summary || '-';
    div.append(l2, tx);
    const nl = document.createElement('div'); nl.className = 'nlink';
    if (r.notionSaved) {
      if (r.notionUrl) { const a = document.createElement('a'); a.href = r.notionUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '노션에서 보기 ↗'; nl.append(a); }
      else nl.textContent = '✓ 노션에 저장됨';
    } else {
      const w = document.createElement('span'); w.className = 'warn'; w.textContent = '노션에 아직 저장 안 됨';
      const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = '노션에 저장';
      b.onclick = async () => { b.disabled = true; b.textContent = '저장 중…'; const f = await pushToNotion(r); note(f ? '⚠️ ' + errorText(f) : '✅ 노션에 저장했어요.'); renderAdmin(); };
      nl.append(w, b);
    }
    div.append(nl); box.append(div);
  });
}

$('prevM').onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } selDate = null; renderAdmin(); };
$('nextM').onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } selDate = null; renderAdmin(); };
$('btnSyncAll').onclick = async () => {
  const b = $('btnSyncAll'); b.disabled = true; b.textContent = '저장 중…';
  let fail = null;
  for (const r of records.filter(x => !x.notionSaved)) { fail = await pushToNotion(r); if (fail) break; }
  b.disabled = false; b.textContent = '노션에 저장';
  note(fail ? '⚠️ ' + errorText(fail) : '✅ 모두 노션에 저장했어요.');
  renderAdmin();
};

render(); renderTodos(); renderMonthMini();
let lastMin = -1;
setInterval(() => {
  render();
  const m = new Date().getMinutes();
  if (m !== lastMin) { lastMin = m; if (session) renderAdmin(); } // 근무 중이면 달력 오늘 칸을 1분마다 갱신
}, 1000);
</script>
